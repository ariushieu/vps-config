# ==========================================================
# Docker Compose - Node.js + MongoDB (Example Template)
# Replace placeholder values (<...>) with your actual config
# Copy .env.example to .env and fill in real credentials
#
# Note: App port will be auto-assigned during deploy_project.sh
# ==========================================================

services:
  app:
    image: <your-dockerhub-username>/<your-app-name>:latest
    container_name: <your-app-container-name>
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"                                # auto-assigned by deploy_project.sh
    environment:
      TZ: ${TZ:-UTC}                                         # Node Date() + system clock inside container
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    image: mongo:7
    container_name: <your-db-container-name>
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}                                         # MongoDB stores dates in UTC; TZ affects logs only
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - /opt/data/<your-project-name>/mongo:/data/db          # e.g. /opt/data/my-api/mongo
    # No host port published — the app reaches MongoDB over the project's private
    # Compose network. To connect a GUI/CLI from the host, use docker exec or an
    # SSH tunnel (see README "Accessing the database"). Publishing 127.0.0.1:27017
    # here would collide across projects and widen the attack surface.
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Each project gets its own default Compose network (named "<project>_default").
# We deliberately do NOT share a single external network across projects: a shared
# network makes the "mysql"/"mongo" service alias resolve to every project's DB,
# so an app could connect to the wrong project's database.
